<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16281e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Présence">
<meta name="description" content="Registre de présence en temps réel — Club Réussir Ensemble">
<title>Registre de présence — Club Réussir Ensemble</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SYSTÈME DE DESIGN — « Registre & Tampon »
   Un registre d'appel (couverture toile bleu nuit, tranche rouge)
   qui s'ouvre sur une page de cahier crème. Le professeur affiche
   un code sur une ardoise ; l'élève appose un tampon d'encre verte
   pour confirmer sa présence — un geste physique, pas juste un clic.
   Hérite du bleu stylo et de l'univers Club Réussir Ensemble.
   ══════════════════════════════════════════════════════════════ */
:root{
  --cover:#1c2b45; --cover-edge:#101a2c; --tranche:#8c2f2a;
  --paper:#faf6ea; --paper-card:#fffdf6; --rule:#e6dcc0;
  --marge:#b5433f; --marge-soft:#e7c9c3;
  --ink:#26313c; --ink-soft:#67737e;
  --stylo:#3457d5; --stylo-dark:#2743ac; --stylo-tint:#eaefff;
  --tampon:#1f8a4c; --tampon-dark:#166238; --tampon-tint:#e8f7ee;
  --absent:#b5433f; --absent-tint:#fbe9e8;
  --board:#16281e; --board-edge:#0c1a12; --chalk:#f4efe0;
  --radius:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font-family:'DM Sans',sans-serif;min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-bottom:32px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}

/* ── En-tête « registre » ── */
.cover-head{background:linear-gradient(180deg,var(--cover),var(--cover-edge));position:relative;padding:22px 20px 26px;color:var(--chalk);border-bottom:5px solid var(--tranche)}
.cover-head::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:5px;background:repeating-linear-gradient(90deg,var(--tranche) 0 14px,#7a2823 14px 16px)}
.cover-eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;margin-bottom:6px}
.cover-title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.15}
.cover-sub{font-family:'Caveat',cursive;font-size:19px;color:#c9d3e6;margin-top:3px}
.who-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;margin-top:12px}
.head-actions{position:absolute;top:20px;right:16px;display:flex;gap:8px}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--chalk);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600}

/* ── Cartes / page cahier ── */
.page{padding:20px 18px 8px}
.card{background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;box-shadow:0 1px 0 var(--rule)}
.card-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:4px}
.card-hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.45}

/* ── Sélecteur de rôle ── */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.role-card{background:var(--paper-card);border:1.5px solid var(--rule);border-radius:var(--radius);padding:22px 14px;text-align:center;transition:transform .15s,border-color .15s}
.role-card:active{transform:scale(.97)}
.role-card .emoji{font-size:32px;display:block;margin-bottom:8px}
.role-card .lbl{font-weight:700;font-size:14.5px}
.role-card.cover-eleve{border-color:var(--stylo)}
.role-card.cover-admin{border-color:var(--cover);font-size:13.5px}

/* ── Champs / boutons ── */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input, .field select{width:100%;padding:11px 12px;border:1.5px solid var(--rule);border-radius:9px;font-size:15px;background:#fff;color:var(--ink)}
.field input:focus, .field select:focus{outline:none;border-color:var(--stylo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:10px;font-weight:700;font-size:14.5px;width:100%}
.btn-primary{background:var(--stylo);color:#fff}
.btn-primary:active{background:var(--stylo-dark)}
.btn-tampon{background:var(--tampon);color:#fff}
.btn-tampon:active{background:var(--tampon-dark)}
.btn-danger{background:var(--absent);color:#fff}
.btn-ghost{background:var(--stylo-tint);color:var(--stylo-dark)}
.btn-outline{background:#fff;border:1.5px solid var(--rule);color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.link-btn{background:none;border:none;color:var(--stylo);font-weight:600;font-size:13.5px;text-decoration:underline;padding:6px 0}

/* ── Ardoise du code de session ── */
.board{background:radial-gradient(ellipse at 50% 0%,#1e3527,var(--board) 70%);border:6px solid var(--board-edge);border-radius:16px;padding:22px 16px;text-align:center;color:var(--chalk);margin-bottom:14px;position:relative;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.board-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;margin-bottom:8px}
.board-code{font-family:'DM Mono',monospace;font-weight:500;font-size:52px;letter-spacing:.22em;line-height:1;text-shadow:0 0 14px rgba(244,239,224,.35)}
.board-meta{margin-top:12px;font-size:13px;opacity:.8;font-family:'DM Sans',sans-serif}
.board-timer{font-family:'DM Mono',monospace;font-size:12px;opacity:.6;margin-top:4px}

/* ── Compteur présence ── */
.count-row{display:flex;gap:10px;margin-bottom:14px}
.count-box{flex:1;background:var(--paper-card);border:1px solid var(--rule);border-radius:10px;padding:12px;text-align:center}
.count-box .n{font-family:'Fraunces',serif;font-weight:600;font-size:24px}
.count-box.present .n{color:var(--tampon)}
.count-box.absent .n{color:var(--absent)}
.count-box .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* ── Liste élèves ── */
.el-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--rule);font-size:14px}
.el-row:last-child{border-bottom:none}
.el-name{font-weight:500}
.el-time{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--tampon-dark);background:var(--tampon-tint);padding:2px 8px;border-radius:20px}
.el-missing{color:var(--absent);font-size:11.5px;font-weight:600}

/* ── Tampon (bouton de validation élève) ── */
.stamp-zone{display:flex;flex-direction:column;align-items:center;padding:18px 10px 6px}
.stamp-btn{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2aa25e,var(--tampon) 60%,var(--tampon-dark) 100%);color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 var(--tampon-dark),0 10px 18px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.stamp-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--tampon-dark),0 4px 10px rgba(0,0,0,.15)}
.stamp-btn .big{font-size:34px}
.stamp-btn.validated{background:radial-gradient(circle at 35% 30%,#8fb99f,#5c8a6e 60%,#3e6b4f 100%);box-shadow:0 4px 0 #2c5039}
@keyframes stampSlam{0%{transform:scale(1.5) rotate(-14deg);opacity:0}55%{transform:scale(.94) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.stamp-mark{margin-top:16px;border:3px solid var(--tampon);color:var(--tampon);border-radius:10px;padding:10px 18px;font-family:'Caveat',cursive;font-weight:700;font-size:26px;transform:rotate(-4deg);animation:stampSlam .4s ease-out}
.code-shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* ── Recherche nom élève ── */
.name-search-results{max-height:220px;overflow-y:auto;border:1px solid var(--rule);border-radius:9px;margin-top:6px}
.name-opt{padding:10px 12px;border-bottom:1px solid var(--rule);font-size:14px;cursor:pointer}
.name-opt:last-child{border-bottom:none}
.name-opt:active{background:var(--stylo-tint)}

/* ── Tabs admin ── */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;border-radius:9px;background:var(--paper-card);border:1px solid var(--rule);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-soft)}
.tab.active{background:var(--stylo);color:#fff;border-color:var(--stylo)}

.session-row{padding:12px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.session-row:last-child{border-bottom:none}
.session-row .top{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.session-row .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
.status-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.status-pill.open{background:var(--tampon-tint);color:var(--tampon-dark)}
.status-pill.closed{background:#eee;color:#888}

.empty-note{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:24px 10px}
.small-note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.top-back{background:none;color:var(--chalk);font-size:13px;font-weight:600;opacity:.8;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
@media(max-width:380px){.board-code{font-size:42px;letter-spacing:.16em}.stamp-btn{width:130px;height:130px}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, setDoc, getDoc, collection, getDocs, onSnapshot,
         addDoc, query, where, orderBy, limit, deleteDoc, updateDoc, serverTimestamp
       } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYeYPOptN2wEak_Ctcr4a8t5qXpj4riLE",
  authDomain: "emploi-temps.firebaseapp.com",
  projectId: "emploi-temps",
  storageBucket: "emploi-temps.firebasestorage.app",
  messagingSenderId: "665985283894",
  appId: "1:665985283894:web:b0c4cb14824bb8fed9a597"
};
const fbApp = initializeApp(firebaseConfig);
let db;
try{
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}catch(e){
  db = initializeFirestore(fbApp, {});
}

// ══════════════════ Collections utilisées ══════════════════
// - profs              (lecture seule, synchronisée depuis Emploi du temps)  {nom, matieres[]}
// - edtxRoster          (lecture seule, synchronisée depuis Emploi du temps)  {name, eleves:[{id,name,prenom,tel}]}
// - edtxPresenceEleves  (créée ici, par l'admin)  {classeId, classeName, eleveId, eleveNom}  — doc id = token
// - edtxPresenceSessions(créée ici, par le prof)  {classeId, classeName, matiere, profNom, profCode, code, active, createdAt, closedAt}
//     └ eleves/{eleveId} (sous-collection)  {eleveNom, validatedAt}

const ADMIN_PASS = 'reussir2024'; // mot de passe admin — identique aux autres apps du club
const SS_KEY = 'edtxPresenceSession';
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function fmtTime(ts){ try{ const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function fmtDate(d){ return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function todayKey(){ return fmtDate(new Date()); }
function genCode(){ return String(Math.floor(1000+Math.random()*9000)); }
function genToken(){ return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6); }

function getSession(){ try{ return JSON.parse(sessionStorage.getItem(SS_KEY)||'null'); }catch(e){ return null; } }
function setSession(s){ sessionStorage.setItem(SS_KEY, JSON.stringify(s)); }
function clearSession(){ sessionStorage.removeItem(SS_KEY); }

// ══════════════════ En-tête commun ══════════════════
function headHtml(eyebrow, title, sub, badge, showBack){
  return `
  <div class="cover-head">
    ${showBack?`<button class="top-back" onclick="goHome()">← Retour</button><br>`:''}
    <div class="cover-eyebrow">${esc(eyebrow)}</div>
    <div class="cover-title">${esc(title)}</div>
    ${sub?`<div class="cover-sub">${esc(sub)}</div>`:''}
    ${badge?`<div class="who-badge">${badge}</div>`:''}
  </div>`;
}

window.goHome = function(){
  clearSession();
  if(typeof eleveSessionUnsub==='function'){ eleveSessionUnsub(); eleveSessionUnsub=null; }
  if(typeof adminSessionUnsub==='function'){ adminSessionUnsub(); adminSessionUnsub=null; }
  if(typeof adminElevesUnsub==='function'){ adminElevesUnsub(); adminElevesUnsub=null; }
  renderRoleSelect();
};

// ══════════════════ Écran d'accueil : choix du rôle ══════════════════
function renderRoleSelect(){
  const s = getSession();
  if(s && s.role==='eleve'){ return renderEleveSpace(s); }
  if(s && s.role==='admin'){ return renderAdminHome(s); }

  const params = new URLSearchParams(location.search);
  const token = params.get('eleve');
  if(token){ return openEleveByToken(token); }

  app.innerHTML = `
    ${headHtml('Club Réussir Ensemble','Registre de présence','L\'appel, en un geste')}
    <div class="page">
      <div class="card">
        <div class="card-title">Qui êtes-vous ?</div>
        <div class="card-hint">Choisissez votre espace pour continuer.</div>
        <div class="role-grid">
          <button class="role-card cover-eleve" onclick="showEleveLogin()"><span class="emoji">🎒</span><span class="lbl">Élève</span></button>
          <button class="role-card cover-admin" onclick="showAdminLogin()"><span class="emoji">🗂️</span><span class="lbl">Espace prof</span></button>
        </div>
        <button id="install-btn" class="btn btn-ghost" style="display:none;margin-top:14px" onclick="installApp()">⬇️ Installer l'application</button>
      </div>
    </div>`;
  const ib = document.getElementById('install-btn');
  if(ib && deferredInstallPrompt) ib.style.display = 'inline-flex';
}

let allClassesCache = null;
async function loadAllClasses(){
  if(allClassesCache) return allClassesCache;
  try{
    const snap = await getDocs(collection(db,'edtxRoster'));
    allClassesCache = snap.docs.map(d=>({ id:d.id, name:d.data().name||d.id, eleves:d.data().eleves||[] }));
  }catch(e){ allClassesCache = []; }
  return allClassesCache;
}

// ══════════════════ CONNEXION ÉLÈVE ══════════════════
let eleveRosterCache = {};
window.showEleveLogin = async function(){
  const classes = await loadAllClasses();
  app.innerHTML = `
    ${headHtml('Espace élève','Ma présence','Choisissez votre classe',null,true)}
    <div class="page">
      <div class="card">
        <div class="field"><label>Classe</label>
          <select id="el-classe" onchange="onEleveClasseChange()"><option value="">Choisir votre classe...</option>
            ${classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div id="el-nom-zone"></div>
      </div>
      <div class="small-note">Vous avez un lien personnel envoyé par votre professeur ? Ouvrez-le directement, il vous connectera automatiquement.</div>
    </div>`;
};
window.onEleveClasseChange = async function(){
  const classeId = document.getElementById('el-classe').value;
  const zone = document.getElementById('el-nom-zone');
  if(!classeId){ zone.innerHTML=''; return; }
  const classes = await loadAllClasses();
  const classe = classes.find(c=>c.id===classeId);
  eleveRosterCache[classeId] = classe ? classe.eleves : [];
  zone.innerHTML = `
    <div class="field"><label>Votre nom</label>
      <input type="text" id="el-nom-search" placeholder="Tapez votre nom..." oninput="filtrerEleveNom('${classeId}')">
    </div>
    <div id="el-nom-results" class="name-search-results" style="display:none"></div>`;
};
window.filtrerEleveNom = function(classeId){
  const q = document.getElementById('el-nom-search').value.trim().toLowerCase();
  const box = document.getElementById('el-nom-results');
  if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
  const list = (eleveRosterCache[classeId]||[]).filter(e=>`${e.name||''} ${e.prenom||''}`.toLowerCase().includes(q)).slice(0,12);
  box.style.display = list.length ? 'block' : 'none';
  box.innerHTML = list.map(e=>{
    const full = `${e.prenom?e.prenom+' ':''}${e.name||''}`.trim();
    return `<div class="name-opt" data-classe="${esc(classeId)}" data-id="${esc(String(e.id))}" data-nom="${esc(full)}">${esc(full)}</div>`;
  }).join('');
  box.querySelectorAll('.name-opt').forEach(el=>{
    el.addEventListener('click', ()=> eleveValiderIdentite(el.dataset.classe, el.dataset.id, el.dataset.nom));
  });
};
window.eleveValiderIdentite = async function(classeId, eleveId, eleveNom){
  const classes = await loadAllClasses();
  const classe = classes.find(c=>c.id===classeId);
  const s = { role:'eleve', classeId, classeName: classe?classe.name:classeId, eleveId, eleveNom };
  setSession(s);
  renderEleveSpace(s);
};
async function openEleveByToken(token){
  app.innerHTML = `${headHtml('Espace élève','Connexion…','',null,false)}<div class="page"><div class="empty-note">Chargement de votre espace…</div></div>`;
  try{
    const snap = await getDoc(doc(db,'edtxPresenceEleves',token));
    if(!snap.exists()){ toast('Lien invalide ou expiré.'); return renderRoleSelect(); }
    const d = snap.data();
    const s = { role:'eleve', classeId:d.classeId, classeName:d.classeName, eleveId:d.eleveId, eleveNom:d.eleveNom, token };
    setSession(s);
    renderEleveSpace(s);
  }catch(e){ toast('Erreur de connexion.'); renderRoleSelect(); }
}

let eleveSessionUnsub = null;
async function renderEleveSpace(s){
  app.innerHTML = `
    ${headHtml('Espace élève', s.eleveNom, s.classeName, null, true)}
    <div class="page" id="el-body">
      <div class="empty-note">Recherche d'un appel en cours pour votre classe…</div>
    </div>`;
  if(eleveSessionUnsub) eleveSessionUnsub();
  const qy = query(collection(db,'edtxPresenceSessions'), where('classeId','==',s.classeId), where('active','==',true));
  eleveSessionUnsub = onSnapshot(qy, snap=>{
    if(snap.empty){ renderEleveNoSession(); return; }
    // Pas d'orderBy ici pour éviter de dépendre d'un index composite Firestore : tri côté client.
    const docsSorted = [...snap.docs].sort((a,b)=>{
      const ta = a.data().createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
      const tb = b.data().createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
      return tb - ta;
    });
    const d = docsSorted[0];
    renderEleveActiveSession(d.id, d.data(), s);
  }, err=>{ console.error('Erreur recherche appel actif:', err); renderEleveNoSession(err); });
}
function renderEleveNoSession(err){
  const body = document.getElementById('el-body');
  if(!body) return;
  if(err){
    body.innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:38px;margin-bottom:8px">⚠️</div>
        <div class="card-title">Connexion impossible</div>
        <div class="card-hint">Une erreur technique empêche de vérifier l'appel en cours. Réessayez, ou contactez votre professeur.</div>
      </div>`;
    return;
  }
  body.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:38px;margin-bottom:8px">🕊️</div>
      <div class="card-title">Aucun appel en cours</div>

window.eleveValiderPresence = async function(sessionId){
  const s = getSession(); if(!s) return;
  const input = document.getElementById('el-code-input');
  const code = (input.value||'').trim();
  if(code.length!==4){ input.parentElement.classList.add('code-shake'); setTimeout(()=>input.parentElement.classList.remove('code-shake'),400); toast('Entrez le code à 4 chiffres.'); return; }
  try{
    const snap = await getDoc(doc(db,'edtxPresenceSessions',sessionId));
    if(!snap.exists() || !snap.data().active){ toast('Cet appel est clôturé.'); renderEleveSpace(s); return; }
    if(snap.data().code !== code){
      input.parentElement.classList.add('code-shake'); setTimeout(()=>input.parentElement.classList.remove('code-shake'),400);
      toast('Code incorrect — redemandez au professeur.'); return;
    }
    await setDoc(doc(db,'edtxPresenceSessions',sessionId,'eleves',s.eleveId), {
      eleveNom: s.eleveNom, eleveId: s.eleveId, validatedAt: serverTimestamp()
    });
    renderEleveActiveSession(sessionId, snap.data(), s);
  }catch(e){ toast('Erreur — réessayez.'); }
};

window.adminOuvrirAppel = async function(){
  const classeId = document.getElementById('ad-ap-classe').value;
  const matiere = document.getElementById('ad-ap-matiere').value.trim();
  const profNom = document.getElementById('ad-ap-prof').value.trim();
  if(!classeId){ toast('Choisissez une classe.'); return; }
  if(!matiere){ toast('Indiquez la matière.'); return; }
  const classes = await loadAllClasses();
  const classe = classes.find(c=>c.id===classeId);
  try{
    // Évite d'ouvrir deux appels actifs pour la même classe
    const qy = query(collection(db,'edtxPresenceSessions'), where('classeId','==',classeId), where('active','==',true));
    const existing = await getDocs(qy);
    if(!existing.empty){
      toast('Un appel est déjà ouvert pour cette classe.');
      renderAdminSession(existing.docs[0].id, existing.docs[0].data());
      return;
    }
    const ref = await addDoc(collection(db,'edtxPresenceSessions'), {
      classeId, classeName: classe?classe.name:classeId, matiere, profNom,
      code: genCode(), active:true, date: todayKey(), createdAt: serverTimestamp()
    });
    renderAdminSession(ref.id, { classeId, classeName: classe?classe.name:classeId, matiere, profNom, code:null, active:true });
  }catch(e){ toast('Erreur à l\'ouverture de l\'appel.'); }
};

window.adminPartagerLien = function(token, eleveNom, canal, tel){
  const url = `${location.origin}${location.pathname}?eleve=${encodeURIComponent(token)}`;
  const msg = `Bonjour, voici ton lien personnel pour le registre de présence (${eleveNom}) : ${url}`;
  const telFormate = formatTelGN(tel);
  if(canal === 'email'){
    const subject = `Ton lien personnel - Registre de présence`;
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`;
  } else if(canal === 'sms'){
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const numero = telFormate || '';
    window.location.href = isIOS
      ? `sms:${numero}&body=${encodeURIComponent(msg)}`
      : `sms:${numero}?body=${encodeURIComponent(msg)}`;
  } else {
    if(!telFormate){ toast('Ajoutez le numéro WhatsApp de l\'élève ci-dessus pour ouvrir directement sa conversation.'); }
    const wa = telFormate
      ? `https://wa.me/${telFormate}?text=${encodeURIComponent(msg)}`
      : `https://wa.me/?text=${encodeURIComponent(msg)}`;
    window.open(wa,'_blank');
  }
};
// Formate un numéro guinéen au format international requis par WhatsApp (sans +, sans espaces)
function formatTelGN(tel){
  if(!tel) return '';
  let n = String(tel).replace(/[^0-9]/g,'');
  if(!n) return '';
  if(n.startsWith('00224')) n = n.slice(2);
  if(n.startsWith('224')) return n;
  if(n.startsWith('0')) n = n.slice(1);
  return '224' + n;
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'inline-flex';
});
window.installApp = async function(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'none';
};
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'none';
});

// ══════════════════ Démarrage ══════════════════
renderRoleSelect();
</script>
</body>
</html>
